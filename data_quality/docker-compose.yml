version: "3.8"

# Data quality services — integrate into your team's main docker-compose.yml
# by merging these service definitions.
#
# Shared dependencies assumed already running:
#   - mlflow  (tracking server on port 5000)
#   - object storage credentials in .env file

services:

  # ── Ingestion Validator ────────────────────────────────────────────────────
  # Runs once at ingestion time, then exits.
  # Triggered by the ingestion pipeline after data lands in object storage.
  ingestion-validator:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python3 scripts/01_ingestion_validator.py
      --container ${CONTAINER_NAME}
      --dataset-version ${DATASET_VERSION:-1.0}
      --mlflow-uri http://mlflow:5000
    environment:
      - OS_AUTH_URL=${OS_AUTH_URL}
      - OS_PROJECT_ID=${OS_PROJECT_ID}
      - OS_AUTH_TOKEN=${OS_AUTH_TOKEN}
      - OS_STORAGE_URL=${OS_STORAGE_URL}
      - OS_REGION=${OS_REGION:-CHI@TACC}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: "no"   # run-once, not a long-lived service

  # ── Training Set Validator ─────────────────────────────────────────────────
  # Runs before retraining. Returns exit code 0 (pass) or 1 (fail).
  # The training service should depend_on this with condition: service_completed_successfully
  training-set-validator:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python3 scripts/02_training_set_validator.py
      --container ${CONTAINER_NAME}
      --dataset-version ${DATASET_VERSION}
      --mlflow-uri http://mlflow:5000
    environment:
      - OS_AUTH_URL=${OS_AUTH_URL}
      - OS_PROJECT_ID=${OS_PROJECT_ID}
      - OS_AUTH_TOKEN=${OS_AUTH_TOKEN}
      - OS_STORAGE_URL=${OS_STORAGE_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: "no"

  # ── Drift Monitor ──────────────────────────────────────────────────────────
  # Long-lived service that checks for distribution drift every 5 minutes.
  # Logs alerts to MLflow and writes /tmp/drift_status.json for health checks.
  drift-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python3 scripts/03_drift_monitor.py
      --container ${CONTAINER_NAME}
      --reference-version ${REFERENCE_DATASET_VERSION:-1.0}
      --mlflow-uri http://mlflow:5000
      --mode continuous
      --interval 300
    environment:
      - OS_AUTH_URL=${OS_AUTH_URL}
      - OS_PROJECT_ID=${OS_PROJECT_ID}
      - OS_AUTH_TOKEN=${OS_AUTH_TOKEN}
      - OS_STORAGE_URL=${OS_STORAGE_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import json,sys; d=json.load(open('/tmp/drift_status.json')); sys.exit(0 if d['status']!='CRITICAL' else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── MLflow (shared with training team) ────────────────────────────────────
  # Include this ONLY if your team doesn't already have an MLflow service.
  # De-duplicate — do not run two MLflow instances.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
